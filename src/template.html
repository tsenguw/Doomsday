<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>末日三族 線上桌遊</title>
<style>
/* 版面：一張夜色牌桌 — 上方對手、中央市集與牌庫、下方自己的角色／面前／手牌；羊皮紙色卡片，三陣營以紅藍綠標示 */
:root{
  color-scheme:dark;
  --table:#131c26; --table-2:#1b2733; --line:#31404f; --ink:#e9e2d0; --dim:#9aa7b3;
  --paper:#f0e6cf; --paper-ink:#2a2418; --ember:#e3a33b;
  --r:#cf4b40; --b:#4b8bd0; --g:#63a257; --magic:#3a3350;
  --display:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif; --body:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--table);color:var(--ink);font:15px/1.5 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
#app{min-height:100%;display:flex;flex-direction:column}
.btn{background:var(--table-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.btn:hover:not(:disabled){border-color:var(--ember)}
.btn.pri{background:var(--ember);color:#231a08;border-color:var(--ember);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:13px}
.dim{color:var(--dim)} .small{font-size:13px}
/* home / lobby */
.wrap{max-width:720px;margin:0 auto;padding:28px 16px;display:flex;flex-direction:column;gap:20px;width:100%}
.hero h1{font-size:40px;font-weight:900;letter-spacing:.06em}
.hero p{margin:8px 0 0;color:var(--dim);max-width:34em}
.panel{background:var(--table-2);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],select{background:var(--table);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit}
label{font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
.code{font-family:var(--display);font-size:34px;letter-spacing:.3em;color:var(--ember)}
.seat{display:flex;justify-content:space-between;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
/* game */
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line)}
.bar h1{font-size:18px}
.bar .sp{flex:1}
.pill{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.pill.on{background:var(--ember);color:#231a08;border-color:var(--ember);font-weight:700}
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;padding:10px 16px}
.opp{background:var(--table-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.opp.turn{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
.opp .nm{font-weight:700;overflow-wrap:anywhere}
.cards{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-height:40px;align-items:center}
.card{--ac:#8d8372;position:relative;flex:0 0 136px;width:136px;min-height:206px;background:#1a1520;color:#e9dfc8;border:1px solid #6b5a44;border-radius:10px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:inset 0 0 0 2px #0e0b12,inset 0 0 0 3px color-mix(in srgb,var(--ac) 55%,#3a2f25)}
.card.cr{--ac:var(--r)}.card.cb{--ac:var(--b)}.card.cg{--ac:var(--g)}.card.M{--ac:#a078d8}.card.V{--ac:#d39a3c}
.art{display:block;position:relative;height:94px;border-radius:6px 6px 2px 2px;overflow:hidden;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--ac) 62%,#000) 0,#0f0b14 90%);border:1px solid color-mix(in srgb,var(--ac) 50%,#000)}
.art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 1px,transparent 1px 5px),radial-gradient(circle at 50% 50%,transparent 48%,rgba(0,0,0,.55) 100%);pointer-events:none}
.art svg{display:block;width:100%;height:100%}
.art .i{fill:#ece1c8}.art .j{fill:#a2947b}.art .a{fill:var(--ac)}.art .k{fill:#17121c}
.art .s,.art .sa,.art .sk,.art .sj{fill:none;stroke-linecap:round;stroke-linejoin:round}
.art .s{stroke:#ece1c8}.art .sa{stroke:var(--ac)}.art .sk{stroke:#17121c}.art .sj{stroke:#a2947b}
.art .moon{fill:#ece1c8;opacity:.15}
.card b{font-family:var(--display);font-size:15px;line-height:1.2;text-align:center;padding:1px 2px 2px;border-bottom:1px solid color-mix(in srgb,var(--ac) 60%,#000);overflow-wrap:anywhere}
.card .meta{font-size:11px;font-weight:700;color:color-mix(in srgb,var(--ac) 70%,#fff);text-align:center}
.card .desc{font-size:11px;line-height:1.35;color:#cfc5ae;background:#231c2a;border:1px solid #3b3144;border-radius:4px;padding:3px 5px 14px;flex:1}
.card .badge{position:absolute;right:3px;bottom:3px;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#140f18;font:700 12px/21px var(--body);text-align:center;border:1px solid #e9dfc8}
.card .where{font-size:10.5px;color:#a79c86;padding-right:24px}
.card .need{font-size:10.5px;font-weight:700;color:var(--ember);padding-right:24px}
.card.sel{border-color:var(--ember);box-shadow:0 0 0 2px var(--ember);transform:translateY(-5px)}
.card.lock{filter:saturate(.55)}
.card.lock::before{content:"橫放";position:absolute;left:4px;top:4px;z-index:1;background:#0e0b12;color:var(--ember);font-size:9px;padding:0 3px;border-radius:3px}
.card.mini{flex:0 0 68px;width:68px;min-height:0;padding:3px;gap:1px}
.card.mini .art{height:46px}
.card.mini b{font-size:11px;border:0;padding:0}
.card.mini .badge{width:15px;height:15px;font-size:9px;line-height:14px;right:2px;top:2px;bottom:auto}
.card.mini.lock{transform:rotate(90deg);margin:-8px 10px}
.card.back{align-items:center;justify-content:center;min-height:78px;background:repeating-linear-gradient(45deg,#231c2a 0 6px,#1a1520 6px 12px);color:#6b5a44;font-family:var(--display);font-size:22px}
.card.big{flex-basis:236px;width:236px}.card.big .art{height:164px}.card.big b{font-size:22px}.card.big .meta{font-size:14px}.card.big .desc{font-size:14px;padding-bottom:22px}.card.big .badge{width:32px;height:32px;line-height:31px;font-size:16px}
.namecol{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:13px}
.gal h3{font-size:16px;color:var(--ember);margin-top:6px}
.piles{align-items:stretch}
.pile{display:flex;flex-direction:column;gap:2px;cursor:default}
.pile[data-a]{cursor:pointer}
.role{flex-direction:row!important;flex-wrap:wrap;gap:10px!important}
.role .info{flex:1 1 130px;display:flex;flex-direction:column;gap:5px;min-width:0}
.fr{border-left-color:var(--r)!important}.fb{border-left-color:var(--b)!important}.fg{border-left-color:var(--g)!important}
.tag-r{color:var(--r)}.tag-b{color:var(--b)}.tag-g{color:var(--g)}
.center{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:6px 16px;align-items:start}
@media(max-width:760px){.center{grid-template-columns:1fr}}
.zone{display:flex;flex-direction:column;gap:6px;min-width:0}
.zone>h3{font-size:13px;font-family:var(--body);font-weight:500;color:var(--dim);letter-spacing:.08em}
.hand{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
.piles{display:flex;gap:8px;flex-wrap:wrap}
.pile{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:13px;min-width:92px;background:none;text-align:left}
.pile b{display:block;font-size:20px;font-family:var(--display);font-variant-numeric:tabular-nums}
.log{background:var(--table-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;height:190px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:3px}
.log div:last-child{color:var(--ember)}
.me{margin-top:auto;border-top:1px solid var(--line);background:var(--table-2);padding:10px 16px 14px;display:grid;grid-template-columns:320px 1fr;gap:14px}
@media(max-width:760px){.me{grid-template-columns:1fr}}
.me.turn{box-shadow:inset 0 3px 0 var(--ember)}
.role{background:var(--table);border:1px solid var(--line);border-left:6px solid var(--dim);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.role h2{font-size:22px}
.role ul{margin:0;padding:0;list-style:none}
.role li::before{content:"○ "} .role li.ok{color:var(--g)} .role li.ok::before{content:"● "}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--ember)}
.guide{margin:0 16px;border:1px solid var(--ember);border-left-width:5px;border-radius:10px;padding:8px 12px;font-size:14px;display:flex;flex-direction:column;gap:5px;background:rgba(227,163,59,.08)}
.guide p{margin:0;max-width:70ch}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.steps span{border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--dim)}
.steps span.now{background:var(--ember);border-color:var(--ember);color:#231a08;font-weight:700}
.steps span.done{text-decoration:line-through}
.ptip{margin:0;font-size:13px;color:var(--ember)}
.wait{padding:6px 16px;color:var(--ember);font-size:14px}
/* sheet / modal */
.shade{position:fixed;inset:0;background:rgba(5,9,13,.6);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--table-2);border:1px solid var(--ember);border-bottom:0;border-radius:14px 14px 0 0;padding:16px;width:min(880px,100%);max-height:86%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:19px;overflow-wrap:anywhere}
.shade.mid{align-items:center}.shade.mid .sheet{border-bottom:1px solid var(--ember);border-radius:14px}
.rules{gap:2px;padding:20px 26px}
.rules h3{font-size:16px;margin:16px 0 4px;color:var(--ember)}
.rules p,.rules li{font-size:14px;line-height:1.85;max-width:none;margin:0;line-break:strict;word-break:normal;overflow-wrap:break-word;text-wrap:pretty}
.rules li{margin:3px 0}
.rules ul,.rules ol{margin:2px 0 4px;padding-left:1.4em}
.off{color:#e0642a;font-weight:600}
.doomp{background:#7a2a1a;border-color:#e0642a;color:#ffd0b8}
.seatTag{font-size:11px;padding:1px 7px;border-radius:10px;background:#e3a33b33;color:#ffd48a;border:1px solid #e3a33b88;margin-left:4px}
.seatline{margin:0 0 8px;padding:0 16px;opacity:.9;line-height:1.7}
.coach{position:fixed;top:0;left:0;right:0;margin:0 auto;width:min(640px,100%);z-index:60;background:#1b2a36;border:2px solid var(--ember);border-top:0;border-radius:0 0 12px 12px;padding:8px 14px;box-shadow:0 6px 24px #000a;font-size:14px;line-height:1.6}
.coach p{margin:4px 0 6px;max-width:none}
.tut-hl{scroll-margin-top:150px;outline:3px solid var(--ember)!important;outline-offset:3px;animation:tutp 1.2s ease-in-out infinite}
@keyframes tutp{50%{outline-color:#ffe08a;box-shadow:0 0 14px 4px #e3a33b88}}
.rules .quote{border-left:3px solid var(--ember);padding-left:12px;margin:4px 0;opacity:.92}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--r);color:#fff;padding:8px 16px;border-radius:8px;z-index:9;max-width:90%}
/* 手機版：縮小對手區與卡牌，把手牌與操作放到市集之後、紀錄之前 */
@media(max-width:760px){
.bar{position:sticky;top:0;z-index:5;background:var(--table);gap:6px;padding:6px 10px}
.bar h1{display:none}
.pill{font-size:12px;padding:1px 8px}
.opps{grid-template-columns:1fr 1fr;gap:6px;padding:6px 10px}
.opp{padding:6px 8px;gap:4px}
.opp .nm{font-size:13px}
.opp .chips{flex-wrap:nowrap;overflow-x:auto;min-height:0;gap:4px;padding-bottom:2px}
.opp .card.mini{flex-basis:50px;width:50px}
.opp .card.mini .art{height:30px}
.opp .card.mini b{font-size:10px}
.opp .chips .small{font-size:11px;line-height:1.3;white-space:nowrap}
.opp .card.back{min-height:50px;font-size:16px}
.bar .btn.sm{padding:2px 7px;font-size:12px}
.bar{row-gap:4px}
.center{display:contents}
.center>.zone{padding:0 10px}
.center>.zone:nth-child(2){order:6}
.zone .cards:not(.hand){flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.card{flex-basis:112px;width:112px;min-height:160px}
.card .art{height:62px}
.card .desc{font-size:11px;line-height:1.3}
.piles{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pile{min-width:0;padding:3px 6px;font-size:11px}
.pile b{font-size:15px}
.pile .card,.pile .dim{display:none}
.log{height:100px;font-size:12px}
.me{order:5;display:flex;flex-direction:column;padding:8px 10px 12px;gap:8px}
.me>.zone{order:-1}
.guide{margin:0 10px;font-size:13px;padding:6px 10px}
.wait{padding:4px 10px;font-size:13px}
}
/* 開場前導短片（約 10 秒，可略過） */
#intro{position:fixed;inset:0;z-index:200;background:#07060b;color:#efe4cc;overflow:hidden;font-family:var(--display);animation:introOut .4s ease 9.4s forwards}
#intro .sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;opacity:0;padding:0 8vw;text-align:center}
#intro .sc svg{overflow:visible;width:min(86vw,520px);height:auto;max-height:46vh}
#intro .cap{text-wrap:balance;font-size:clamp(19px,4.6vw,32px);line-height:1.6;letter-spacing:.06em;text-shadow:0 2px 14px #000}
#intro .s1{background:radial-gradient(ellipse at 50% 78%,#5b4316 0,#161018 60%,#07060b 100%);animation:scFade 2.5s ease 0s both}
#intro .s2{background:radial-gradient(ellipse at 50% 100%,#6b1a14 0,#1a0c10 60%,#07060b 100%);animation:scFade 2.6s ease 2.2s both}
#intro .s3{background:radial-gradient(ellipse at 50% 30%,#2b1d4a 0,#0d0a18 62%,#050409 100%);animation:scFade 3s ease 4.5s both}
#intro .s4{background:radial-gradient(ellipse at 50% 50%,#26202c 0,#0b0910 70%);animation:scIn .7s ease 7.4s both}
@keyframes scFade{0%{opacity:0}16%{opacity:1}84%{opacity:1}100%{opacity:0}}
@keyframes scIn{0%{opacity:0}100%{opacity:1}}
@keyframes introOut{to{opacity:0}}
@keyframes rise{0%{transform:translateY(24px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flash{0%,60%,100%{opacity:.15}64%,70%{opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
#intro .s1 .orb{transform-origin:50px 40px;animation:rise 2.2s ease .1s both}
#intro .s1 .wv{animation:sway 1.6s ease-in-out infinite}
#intro .s2 .sw{transform-origin:50px 30px;animation:pop .9s ease .5s both}
#intro .s2 .fl{animation:sway .7s ease-in-out infinite}
#intro .s3 .bolt{animation:flash 1.6s linear infinite}
#intro .s3 .eye{transform-origin:50px 28px;animation:pop 1s ease .3s both}
#intro .s4 .em1{animation:pop .7s ease 7.8s both}#intro .s4 .em2{animation:pop .7s ease 8.1s both}#intro .s4 .em3{animation:pop .7s ease 8.4s both}
#intro .ttl{font-size:clamp(34px,10vw,64px);letter-spacing:.3em;color:#e3a33b;text-shadow:0 0 22px rgba(227,163,59,.5);animation:pop .8s ease 8.4s both}
#intro .bar2{position:absolute;left:0;bottom:0;height:3px;background:#e3a33b;width:0;animation:introBar 9.8s linear forwards}
@keyframes introBar{to{width:100%}}
#intro .skip{position:absolute;right:16px;bottom:18px;z-index:2;background:rgba(0,0,0,.45);color:#efe4cc;border:1px solid #6b5a44;border-radius:99px;padding:6px 18px;font:600 14px/1 var(--body);letter-spacing:.2em;cursor:pointer}
#intro .skip:hover{border-color:#e3a33b;color:#e3a33b}
@media(prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-iteration-count:1!important}#intro .sc{animation-duration:2.5s!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
'use strict';
const $=(q)=>document.querySelector(q);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=G.C, ROLES=G.ROLES, FAC=G.FAC;
const BOTN=['電腦甲','電腦乙','電腦丙','電腦丁','電腦戊','電腦己','電腦庚'];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let db=null,user=null,uid=null,capReady=false,canWrite=null,NET='',netErr='';
let tut=null;
let mode='home',local=false,net=null,S=null,V=0,lastS='',chain=Promise.resolve(),botT=null,toastT=null;
let myName=store.get('ew-name')||'';
let NEED=()=>false;
const ui={guide:store.get('ew-guide')!=='0',sel:null,give:false,psel:[],pkey:'',detail:null,rules:false,pile:false,practice:3,doom:store.get('ew-doom')==='1',codeIn:'',busy:false,loadNote:''};
try{const h=(location.hash||'').match(/^#room-(\d{4})$/);if(h)ui.codeIn=h[1];}catch(e){}

function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3600);}
function facKey(role){return FAC[ROLES[role].f].key}
function myPid(){if(!S)return -1;return local?0:S.players.findIndex((p)=>p.id===uid)}
function isHost(){return local||(net&&net.doc&&net.doc.host===uid)}
function actor(){return S.prompt?S.prompt.pid:S.turn}

// ---------- 同步 ----------
function commit(fn,keep){
  if(!S)return false;
  const c=JSON.parse(JSON.stringify(S));const err=fn(c);
  if(err){if(!keep)toast(err);return false;}
  S=c;V++;if(!keep){ui.sel=null;ui.give=false;}
  push({phase:'play',s:JSON.stringify(S)});render();return true;
}
function push(patch){
  if(local||!net)return;
  const body=Object.assign({},net.doc,patch,{v:V,ts:Date.now()});net.doc=body;lastS=body.s||'';
  if(db&&db.touch)db.touch(net.code,body.ts);
  chain=chain.then(()=>net.ref.set(body)).catch((e)=>{toast(e&&e.code==='invalid_argument'?'寫入被拒絕：你可能沒有這個頁面的編輯／參與權限，請房主調整分享設定。':'寫入失敗，請稍後再試（'+((e&&e.code)||'未知')+'）');});
}
function setDoc(patch){V++;push(patch);render();}
function subscribe(code){
  const ref=db.doc('games/'+code);
  net={code,ref,doc:null,seats:[],unsubs:[],seen:{},sig:'',offSince:0,mySeatT:0,presInit:false};V=0;S=null;lastS='';mode='lobby';local=false;store.set('ew-room',code);
  try{location.hash='room-'+code}catch(e){}
  net.hb=setInterval(()=>{if(net&&net.doc&&net.doc.host===uid)push({});},30*60*1000); // 房主每 30 分鐘更新活動時間
  net.pw=setInterval(sendPresence,12000);net.pc=setInterval(presCheck,4000); // 在線心跳與房主接手檢查
  ui.loadNote='';const lt=setTimeout(()=>{ui.loadNote='連線較慢，資料可能尚未更新…';render()},10000);
  const dead=(e)=>{clearTimeout(lt);toast('連線中斷（'+((e&&e.code)||'')+'），請重新整理頁面後再加入。')};
  net.unsubs.push(ref.onSnapshot((snap)=>{
    if(!snap.metadata||!snap.metadata.fromCache){clearTimeout(lt);ui.loadNote='';}
    if(!snap.exists){if(!snap.metadata||!snap.metadata.fromCache){if(net&&net.doc){toast('房間已關閉');leave(true);}}return;}
    const d=snap.data();if(!net||typeof d.v!=='number'||d.v<V)return;

    while(s.players[b].hand.length<5){const k=deck.findIndex((i)=>!bad(C(i)));s.players[b].hand.push(deck.splice(k<0?0:k,1)[0]);}}

  <h3>你的回合：四選一</h3><p>每個回合你<b>必須且只能</b>從下列四個行動中選一個：</p>

  <li><b>判定時機</b>：每個動作（包含連鎖的技能、事件與【無效】）全部結算完才判定。如果同時有數人達成，從當前回合玩家開始依座位順序判定，<b>個人勝利優先於陣營勝利</b>。</li></ul>

  <li>遊戲有輪數上限：4 人 14 輪、5 人 12 輪、6 人 10 輪（全桌每人輪到一次為一輪，畫面上方會顯示「☄ 第 N／上限 輪」）。</li>
  <li>最後 5 輪的每一輪開始時，由先手玩家強制觸發一張事件（末日將至）。</li>
  <li>最後一輪結束仍無人獲勝時，末日降臨：比較每個人的個人勝利條件完成度（專屬裝備依張數算部分完成；史萊姆依其他類裝備張數），最高者獲勝；同分再比陣營條件進度、面前裝備張數，仍同分則共同倖存。</li></ul>
  <h3>角色一覽</h3><ul>${rl}</ul>
  <h3>範例回合</h3>
  <p>小美是<b class="tag-r">魔王軍</b>的吸血鬼，戰鬥指數 3；阿凱是<b class="tag-b">勇者團</b>的劍士，戰鬥指數 2，面前有 2 張未橫放的裝備。輪到小美：</p>
  <ol><li>她先發動技能「吸血」，把別人面前的吸血鬼裝備移到自己面前。這個技能不算動作，但她的角色從此被所有人看見。</li>
  <li>接著她選擇「發動一張資源卡」，打出【決鬥】，指定阿凱。3 比 2，小美獲勝，差 1，所以從阿凱面前拿走 1 張未橫放的裝備。</li>
  <li>阿凱手上正好有【無效】，他可以立刻打出，讓這張【決鬥】失效；【無效】不能再被無效，決鬥就此取消。</li>
  <li>小美回合結束，手牌補回 5 張，換下家行動。</li></ol>
  <h3>常見問題</h3><ul>
  <li><b>場上只有 1 位村民會玩家，他能靠陣營勝利贏嗎？</b>不行。陣營勝利要同陣營至少 2 位玩家，各自都湊齊自己角色的 2 張專屬裝備；只有 1 人時只能走個人勝利。</li>
  <li><b>個人與陣營勝利同時成立呢？</b>個人勝利優先。</li>
  <li><b>發動技能一定會暴露我嗎？</b>主動技能會；被動技能不會。轉生後角色重新隱藏。</li>
  <li><b>橫放的裝備還算數嗎？</b>算，仍計入勝利條件與 5 張上限，只是不能被拿走或丟棄。</li>
  <li><b>輪到我時手上沒牌可打怎麼辦？</b>可以選與市集交換、換掉全部手牌（手牌全是同一種時）或轉生。</li>
  <li><b>史萊姆怎麼贏？</b>個人條件是任 4 個其他類裝備；陣營條件是同陣營至少 2 人，並湊齊 3 張其他類裝備。它的技能「變形」可以從角色牌庫選一個新角色，不觸發事件，也可以順勢改變目標。</li>
  </ul>
  <h3>新手小提示</h3><ul>
  <li>先觀察、少揭露：太早發動技能，會讓別人知道你的目標。</li>
  <li>拿到自己角色的專屬裝備後，盡快橫放保護起來。</li>
  <li>【無效】是最好的防守，手上留一張可以讓你的關鍵回合不被破壞。</li>
  <li>戰鬥指數高的角色適合主動決鬥；指數低的角色，要靠技能與【無效】補強。</li>
  <li>面前裝備滿 5 張時，記得先清掉用不到的牌，再接收新的裝備。</li></ul>
  <h3>連線版的補充裁定</h3><ul><li>「上家／下家」取代左右：下家是回合順序的下一位。</li><li>角色技能每次轉生只能用一次。</li><li>【無效】只詢問手上有這張牌的玩家，不能再被無效。</li><li><b>斷線重連</b>：牌局狀態存在房間資料裡。重新開啟同一個網頁會自動回到原房間與原座位；換了裝置或清除瀏覽器資料時，可在牌桌畫面上「接手」一位離線玩家的座位。</li><li><b>結束與再來一局</b>：遊戲結束時，所有玩家的畫面都會跳出結果視窗。任何一位玩家按「再來一局」，就會用同一批玩家（離線的玩家會被略過，不足 4 人由電腦補滿）直接開新的一局，不用離開房間；房主也可以選「回到大廳」重新調整人數。所有人都離開後，房間會自動刪除。</li><li><b>房主離線</b>：房主約 40 秒沒有回應時，由最早入座且在線的真人自動接手房主（負責電腦玩家出牌、開始遊戲）。對方離線的玩家旁會標示「離線」，房主可以先按「交給電腦代打」讓遊戲繼續。</li><li>資源、角色資訊都存在共用的房間資料裡，畫面只顯示你該看到的部分；這是朋友間的遊戲，沒有防作弊機制。</li></ul></div></div>`;
}
function render(){
  if(S&&S.phase==='over'){const k=JSON.stringify(S.winners)+'|'+S.round+'|'+S.log.length;if(ui.overKey!==k){ui.overKey=k;ui.hideOver=false;}}else ui.overKey='';
  maybeIntro();
  const app=$('#app');let h;
  if(mode==='home')h=homeHTML();else if(mode==='lobby'||!S)h=net?lobbyHTML():homeHTML();else h=gameHTML()+promptHTML()+overHTML();
  const ae=document.activeElement,keep=ae&&ae.id&&(ae.tagName==='INPUT')?{id:ae.id,v:ae.value,s:ae.selectionStart}:null;
  const hand=document.querySelector('.hand'),hs=hand?hand.scrollLeft:0;

  tutHL();
  tick();
}

  if(a==='close'){if(el.classList.contains('shade')&&e.target!==el)return;if(ui.detail&&(ui.gallery||ui.pile)){ui.detail=null;return render();}ui.detail=null;ui.rules=false;ui.pile=false;ui.gallery=false;return render();}
  switch(a){
    case 'rules':ui.rules=true;break;
    case 'guide':ui.guide=!ui.guide;store.set('ew-guide',ui.guide?'1':'0');break;
    case 'detail':ui.detail={k:el.dataset.k||'c',id:el.dataset.k&&el.dataset.k!=='c'?el.dataset.id:cid};break;
    case 'gallery':ui.gallery=true;ui.rules=false;break;
    case 'pile':ui.pile=true;break;
    case 'create':createRoom();return;
    case 'join':joinRoom();return;
    case 'local':tut=null;startLocal();return;
    case 'tutorial':startTutorial();return;
    case 'tutnext':tut.i++;break;
    case 'tutpractice':tut=null;ui.hideOver=false;startLocal();return;
    case 'leave':leave();return;
    case 'sit':if(needName())mySeat().catch(()=>toast('入座失敗：沒有寫入權限'));return;
    case 'start':startOnline();return;
    case 'copyinv':try{navigator.clipboard.writeText(inviteURL()).then(()=>toast('已複製邀請連結'),()=>toast('複製失敗，請手動選取連結'));}catch(e){toast('複製失敗，請手動選取連結');}return;
    case 'tolobby':S=null;mode='lobby';ui.hideOver=false;setDoc({phase:'lobby',s:''});return;
    case 'again':ui.hideOver=false;tut=null;startLocal();return;
    case 'newgame':{
      if(local||!net||!S||S.phase!=='over'||me<0)return;
      const seats=[],dropped=[];
      S.players.forEach((p)=>{if(p.bot)seats.push({id:p.id,name:p.name,bot:true});else if(online(p.id))seats.push({id:p.id,name:p.name});else dropped.push(p.name);});
      for(let k=0;seats.length<4;k++){const id='bot'+k;if(!seats.some((x)=>x.id===id))seats.push({id,name:BOTN[k]||('電腦'+k),bot:true});}
      S=G.newGame(seats,{doom:!!(S.opts&&S.opts.doom)});introKey=introKeyOf(S);ui.hideOver=false;ui.sel=null;ui.give=false;V++;
      push({phase:'play',s:JSON.stringify(S)});mode='game';
      if(dropped.length)toast('已略過離線玩家：'+dropped.join('、'));
      render();return;}
    case 'hideover':ui.hideOver=true;break;
    case 'claim':{if(!net||!S)return;const i=+el.dataset.p,old=S.players[i].id,nmx=S.players[i].name;if(online(old))return toast('這位玩家目前在線上');
      commit((c)=>{c.players[i].id=uid;return null;},true);
      if(net.doc.host===old)setDoc({host:uid});
      net.mySeatT=0;try{db.doc('games/'+net.code+'/seats/'+old).delete().catch(()=>{});}catch(er){}
      sendPresence();toast('已接手「'+nmx+'」的座位');return;}
    case 'tobot':commit((c)=>{const p=c.players[+el.dataset.p];p.bot=!p.bot;return null;},true);return;
    case 'sel':ui.sel=ui.sel===cid?null:cid;ui.give=false;break;
    case 'giveon':ui.give=true;break;
    case 'giveoff':ui.give=false;break;
    case 'playself':case 'cast':commit((c)=>G.act(c,me,{t:'play',c:ui.sel,to:me}));return;
    case 'playto':commit((c)=>G.act(c,me,{t:'play',c:ui.sel,to:+el.dataset.p}));return;
    case 'market':commit((c)=>G.act(c,me,{t:'market',c:ui.sel,m:cid}));return;
    case 'redraw':commit((c)=>G.act(c,me,{t:'redraw'}));return;
    case 'reinc':commit((c)=>G.act(c,me,{t:'reinc'}));return;
    case 'skill':commit((c)=>G.act(c,me,{t:'skill'}));return;
    case 'end':commit((c)=>G.act(c,me,{t:'end'}));return;
    case 'ans':commit((c)=>G.respond(c,me,el.dataset.v));return;
    case 'psel':{const p=S.prompt;if(!p)return;const i=ui.psel.indexOf(cid);if(i>=0)ui.psel.splice(i,1);else{if(p.max===1)ui.psel=[cid];else if(ui.psel.length<p.max)ui.psel.push(cid);}break;}
    case 'pok':{const sel=ui.psel.slice();commit((c)=>G.respond(c,me,sel));return;}
  }
  render();
});

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s);});}
function fbAdapter(fdb){
  // 路徑對照：games/X → g/X/d；games/X/seats → g/X/seats；games/X/seats/U → g/X/seats/U
  const map=(path)=>{const s=path.split('/');return s.length===2?'g/'+s[1]+'/d':'g/'+s.slice(1).join('/');};
  const wrap=(fn)=>fn().catch((e)=>{throw {code:/permission/i.test(String(e&&e.message||e))?'invalid_argument':'unavailable',message:String(e&&e.message||e)};});
  const snapOf=(s)=>({id:s.key,exists:s.exists(),data:()=>s.val()||undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  return {
    doc(path){const ref=fdb.ref(map(path));const seat=path.split('/').length===4;return {
      get:()=>wrap(()=>ref.get().then(snapOf)),
      set:(v)=>wrap(()=>ref.set(v).then(()=>{if(seat)ref.onDisconnect().remove();})),
      delete:()=>wrap(()=>ref.remove()),
      onSnapshot(next,err){const cb=(s)=>next(snapOf(s));ref.on('value',cb,(e)=>err&&err({code:'unavailable',message:String(e)}));return ()=>ref.off('value',cb);}
    };},
    touch(code,ts){fdb.ref('idx/'+code).set(ts).catch(()=>{});},
    async removeRoom(code){await fdb.ref('g/'+code).remove();await fdb.ref('idx/'+code).remove();},
    async sweepEmpty(idleMs){ // 沒有任何人在座、且閒置一段時間的房間（例如大家直接關掉網頁）
      const s=await fdb.ref('idx').orderByValue().endAt(Date.now()-idleMs).limitToFirst(50).get();const codes=[];
      s.forEach((c)=>{codes.push(c.key);});let n=0;
      for(const c of codes){const seats=await fdb.ref('g/'+c+'/seats').get();if(!seats.exists()){await fdb.ref('g/'+c).remove();await fdb.ref('idx/'+c).remove();n++;}}
      return n;
    },
    async sweep(cutoff){
      const s=await fdb.ref('idx').orderByValue().endAt(cutoff).limitToFirst(50).get();const codes=[];
      s.forEach((c)=>{codes.push(c.key);});
      for(const c of codes){await fdb.ref('g/'+c).remove();await fdb.ref('idx/'+c).remove();}
      return codes.length;
    },
    collection(path){const ref=fdb.ref(map(path));return {
      onSnapshot(next,err){const cb=(s)=>{const docs=[];s.forEach((c)=>{docs.push({id:c.key,exists:true,data:()=>c.val()});});next({docs,size:docs.length,empty:!docs.length});};
        ref.on('value',cb,(e)=>err&&err({code:'unavailable',message:String(e)}));return ()=>ref.off('value',cb);}
    };}
  };
}
async function bootFirebase(){
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  await loadScript(base+'firebase-app-compat.js');
  await Promise.all([loadScript(base+'firebase-auth-compat.js'),loadScript(base+'firebase-database-compat.js')]);
  const app=firebase.initializeApp(FB_CONFIG);
  try{const cred=await firebase.auth(app).signInAnonymously();uid=cred.user.uid;}
  catch(e){netErr='匿名登入失敗：請到 Firebase 主控台的 Authentication 開啟「匿名」登入方式。';throw e;}
  const fdb=firebase.database(app);
  db=fbAdapter(fdb);NET='firebase';
  db.sweep(Date.now()-ROOM_TTL).catch(()=>{}); // 進站時順手清掉過期房間
  db.sweepEmpty(30*60*1000).catch(()=>{}); // 以及沒人在座、閒置超過 30 分鐘的房間
}
